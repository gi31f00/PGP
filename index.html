
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frank Gielen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 5px solid white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .contact-btn {
            display: inline-block;
            padding: 12px 30px;
            background: #23a6d5;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: background 0.3s ease;
        }

        .contact-btn:hover {
            background: #1e87b3;
        }

        .social-links {
            margin-top: 20px;
        }

        .social-links a {
            color: #666;
            font-size: 1.5em;
            transition: color 0.3s ease;
            display: inline-block;
        }

        .social-links a:hover {
            color: #0077b5; /* LinkedIn brand color */
            transform: scale(1.2);
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @media (max-width: 768px) {
            .profile-card {
                margin: 20px;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="profile-img">
                <img src="images/profile.jpg" alt="Profile Photo">
            </div>
            <h1>Frank Gielen</h1>
<!-- Op de volgende regel kun je een omschrijving zetten -->
            <p></p>
            <p><a href="mailto:gielen@gielen.top" class="contact-btn">Contact</a></p>
            <p><a href="public.asc" class="contact-btn">PGP public key</a></p>
            <p><a href="fingerprint.txt" class="contact-btn">PGP fingerprint</a></p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/frank-gielen/" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
